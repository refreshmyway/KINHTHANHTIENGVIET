<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINH THÁNH - Hai Phiên Bản</title>

<style>
• { box-sizing: border-box; }

body {
margin: 0;
padding: 20px 15px 50px;
background: #10141c;
color: #f2f4f8;
font-family: Arial, sans-serif;
}

#app {
max-width: 900px;
margin: auto;
}

header {
text-align: center;
padding: 20px 5px 30px;
}

h1 {
font-size: clamp(27px, 5vw, 38px);
margin: 0 0 10px;
}

.subtitle {
color: #b8c5d6;
font-size: 17px;
}

.sectionTitle {
font-size: 23px;
margin: 20px 0;
font-weight: bold;
}

.grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 12px;
}

button {
font: inherit;
cursor: pointer;
color: white;
border: 1px solid #39485d;
background: #202b3b;
border-radius: 12px;
padding: 17px 10px;
font-weight: bold;
min-height: 65px;
}

button:active {
background: #31527b;
}

.version {
min-height: 115px;
font-size: 20px;
background: #1d3553;
}

.testament {
min-height: 130px;
font-size: 23px;
background: #1d3553;
}

small {
display: block;
margin-top: 10px;
font-size: 15px;
color: #cbd8e8;
}

.bookButton {
text-align: left;
font-size: 17px;
}

.back {
width: 100%;
margin-bottom: 18px;
background: #303c4e;
min-height: 50px;
}

.playlist {
display: block;
text-align: center;
background: #1769c2;
color: white;
padding: 17px 12px;
border-radius: 12px;
font-size: 19px;
font-weight: bold;
text-decoration: none;
margin: 20px 0;
}

.chapterGrid {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: 9px;
}

.chapterGrid a {
display: block;
text-align: center;
padding: 13px 5px;
border: 1px solid #3a4a60;
border-radius: 9px;
color: #9ed5ff;
background: #1c2736;
text-decoration: none;
font-size: 17px;
}

.chapterGrid a:active {
background: #31527b;
}

.status {
text-align: center;
color: #ffc66d;
margin: 20px 0;
}

@media (max-width: 480px) {
.chapterGrid {
grid-template-columns: repeat(3, minmax(0, 1fr));
}
}
</style>
</head>

<body>
<div id="app"></div>

<script>
(function () {
const app = document.getElementById("app");

const sources = {
"TRUYỀN THỐNG": "truyen-thong.html",
"HIỆU ĐÍNH": "hieu-dinh.html"
};

let currentVersion = "";
let books = [];
let currentTestament = "";

function header() {
const h = document.createElement("header");
h.innerHTML = &lt;h1&gt;KINH THÁNH&lt;/h1&gt; &lt;div class="subtitle"&gt;Cựu Ước & Tân Ước&lt;/div&gt;;
return h;
}

function button(label, cls, action) {
const b = document.createElement("button");
b.textContent = label;
b.className = cls || "";
b.addEventListener("click", action);
return b;
}

function clearPage() {
app.innerHTML = "";
app.appendChild(header());
}

// Đọc sách và link trực tiếp từ file HTML cũ
async function loadVersion(version) {
currentVersion = version;
app.innerHTML = "<p class='status'>Đang tải dữ liệu Kinh Thánh...</p>";

try {
const response = await fetch(sources[version]);

if (!response.ok) {
throw new Error("Không tìm thấy file " + sources[version]);
}

const html = await response.text();
const doc = new DOMParser().parseFromString(
html, "text/html"
);

books = [];

doc.querySelectorAll(".book").forEach(book => {
const heading = book.querySelector("h2, h3");
const playlist = book.querySelector("a.playlist");
const chapterLinks = book.querySelectorAll(
".chapter a[href]"
);

if (!heading) return;

const item = {
name: heading.textContent
.replace("📘", "")
.trim(),
testament: heading.tagName === "H3" ? "OT" : "NT",
playlist: playlist ? playlist.getAttribute("href") : "",
chapters: []
};

chapterLinks.forEach(a => {
item.chapters.push({
name: a.textContent.trim(),
url: a.getAttribute("href")
});
});

books.push(item);
});

if (!books.length) {
throw new Error("Không đọc được danh sách sách trong file nguồn.");
}

renderTestaments();

} catch (error) {
app.innerHTML = "";
app.appendChild(header());

const msg = document.createElement("p");
msg.className = "status";
msg.textContent =
"Lỗi tải dữ liệu: " + error.message +
". Hãy kiểm tra tên và vị trí hai file HTML.";
app.appendChild(msg);
}
}

// Trang đầu: chọn phiên bản
function renderHome() {
clearPage();

const title = document.createElement("div");
title.className = "sectionTitle";
title.textContent = "CHỌN PHIÊN BẢN";
app.appendChild(title);

const grid = document.createElement("div");
grid.className = "grid";

Object.keys(sources).forEach(version => {
grid.appendChild(button(
version,
"version",
() => loadVersion(version)
));
});

app.appendChild(grid);
}

// Chọn Cựu Ước hoặc Tân Ước
function renderTestaments() {
clearPage();

app.appendChild(button(
"← TRỞ VỀ CHỌN PHIÊN BẢN",
"back",
renderHome
));

const title = document.createElement("div");
title.className = "sectionTitle";
title.textContent = currentVersion;
app.appendChild(title);

const grid = document.createElement("div");
grid.className = "grid";

const oldBooks = books.filter(b => b.testament === "OT");
const newBooks = books.filter(b => b.testament === "NT");

grid.appendChild(button(
"CỰU ƯỚC\n" + oldBooks.length + " sách",
"testament",
() => renderBooks("OT")
));

grid.appendChild(button(
"TÂN ƯỚC\n" + newBooks.length + " sách",
"testament",
() => renderBooks("NT")
));

app.appendChild(grid);
}

// Danh sách sách
function renderBooks(testament) {
currentTestament = testament;

clearPage();

app.appendChild(button(
"← TRỞ VỀ CỰU ƯỚC / TÂN ƯỚC",
"back",
renderTestaments
));

const title = document.createElement("div");
title.className = "sectionTitle";
title.textContent =
testament === "OT" ? "CỰU ƯỚC" : "TÂN ƯỚC";

app.appendChild(title);

const list = books.filter(
b => b.testament === testament
);

const grid = document.createElement("div");
grid.className = "grid";

list.forEach(book => {
grid.appendChild(button(
"📖 " + book.name,
"bookButton",
() => renderBook(book)
));
});

app.appendChild(grid);
}

// Danh sách chương và playlist
function renderBook(book) {
clearPage();

app.appendChild(button(
"← TRỞ VỀ DANH SÁCH SÁCH",
"back",
() => renderBooks(currentTestament)
));

const title = document.createElement("div");
title.className = "sectionTitle";
title.textContent = "📖 " + book.name;
app.appendChild(title);

if (book.playlist) {
const playlist = document.createElement("a");
playlist.className = "playlist";
playlist.href = book.playlist;
playlist.target = "_blank";
playlist.rel = "noopener";
playlist.textContent = "▶ MỞ TOÀN BỘ SÁCH";
app.appendChild(playlist);
}

const chapterTitle = document.createElement("div");
chapterTitle.className = "sectionTitle";
chapterTitle.textContent = "CÁC CHƯƠNG";
app.appendChild(chapterTitle);

const grid = document.createElement("div");
grid.className = "chapterGrid";

book.chapters.forEach(chapter => {
const a = document.createElement("a");
a.href = chapter.url;
a.target = "_blank";
a.rel = "noopener";
a.textContent = chapter.name;
grid.appendChild(a);
});

app.appendChild(grid);
}

renderHome();
})();
</script>
</body>
</html>
